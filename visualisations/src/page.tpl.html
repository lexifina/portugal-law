<style>
:root {

    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
    --land: #2c2c2a; --land-line: #1a1a19;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }

.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }

.tile span { font-size: 12px; color: var(--text-2); line-height: 1.5; display: block; margin-top: 2px; }

details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }

table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }

.dek { color: var(--text-2); margin: 0 0 12px; max-width: 840px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; line-height: 1.5; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid; border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }

.axis text, .lbl { fill: var(--text-2); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }

.lbl.big { font-size: 12px; }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.6; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip .q { margin-top: 4px; color: var(--text-2); }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.4 var(--sans); }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.4 var(--sans); overflow-wrap: anywhere; min-height: 2.8em; display: flex; align-items: flex-end; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.4 var(--sans); color: var(--text-2); overflow-wrap: anywhere; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.15 var(--sans); color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); line-height: 1.5; }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; background: var(--surface); }
.ptile .pbar i { display: block; }
.sub { margin: 18px 0 4px; font: 600 13px/1.4 var(--sans); }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 15px; }
  .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>
</head>

<script>
const DATA = /*DATA*/null;
</script>
<script>
"use strict";
const D = DATA.charts, PF = DATA.profile;
let LANG = 'pt';
try { const q = new URLSearchParams(location.search).get('lang'); if (q === 'en' || q === 'pt') LANG = q; else { const s = localStorage.getItem('pt-viz-lang'); if (s === 'en' || s === 'pt') LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const t = localStorage.getItem('pt-viz-theme'); if (t === 'light' || t === 'dark') THEME = t; } catch (e) {}

// ------------------------------------------------------------------ strings
const S = {
pt: {
  title: 'O direito português em 20 gráficos',
  lede: 'Vinte gráficos desenhados só com os dados deste repositório: todos os atos da 1.ª série do Diário do Governo e do Diário da República desde 1910, com os seus sumários; a Constituição e os códigos com as suas versões; o Jornal Oficial da Região Autónoma da Madeira; os dados abertos da Assembleia da República; e as decisões do Tribunal Constitucional e da arbitragem tributária.',
  profile_h: 'Perfil dos dados: o que foi usado e quão completo está',
  tbl: 'Tabela de dados', src: 'Fonte no repositório', n: 'Registos', cover: 'Cobertura', caveat: 'Limite', ds: 'Dados',
  foot: 'Feito a partir do repositório lexifina/portugal-law ({built}). Os números são calculados pelo script visualisations/src/prep.py a partir do histórico git, dos registos de cada ato e das tabelas extraídas por make.py; a página é montada por build.py. Todos os gráficos são descritivos: mostram o que as fontes registam, não porquê.',
  year: 'Ano', total: 'Total', share: 'Proporção', partial: 'ano incompleto',
  gl: 'Gráficos sobre o direito de todos os países, a partir de todo o global-law: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. Aqui, só os de Portugal.',
},
en: {
  title: 'Portuguese law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: every act of the 1.ª série (first series) of the Diário do Governo and the Diário da República since 1910, with its summary; the Constitution and the codes with their versions; the official journal of the Autonomous Region of Madeira; the Assembleia da República\'s open data; and the rulings of the Constitutional Court and of tax arbitration.',
  profile_h: 'Data profile: what was used and how complete it is',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit', ds: 'Dataset',
  foot: 'Built from the lexifina/portugal-law repository ({built}). The numbers are computed by visualisations/src/prep.py from the git history, the record of each act and the tables make.py extracts; build.py assembles the page. All charts are descriptive: they show what the sources record, not why.',
  year: 'Year', total: 'Total', share: 'Share', partial: 'partial year',
  gl: 'Charts on every country\'s law, from the whole of global-law: <a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>. These are the charts on Portugal alone.',
}};
const t = k => S[LANG][k];
const PT = () => LANG === 'pt';
const L = (pt, en) => PT() ? pt : en;
const NB = ' ';
const grp = (s, sep) => s.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
// pt-PT: no separator up to four digits (2098), a no-break space from five (23 350); en: commas
const gi = s => PT() ? (s.length > 4 ? grp(s, NB) : s) : grp(s, ',');
const fmt = n => { if (n == null || isNaN(n)) return '–'; const v = Math.round(+n); return (v < 0 ? '−' : '') + gi(String(Math.abs(v))); };
const dec = (v, d = 1) => { const s = Math.abs(+v).toFixed(d), [i, f] = s.split('.'); return (+v < 0 ? '−' : '') + gi(i) + (f ? (PT() ? ',' : '.') + f : ''); };
const PS = () => PT() ? NB + '%' : '%';
const pct = (a, b, d = 0) => b ? dec(100 * a / b, d) + PS() : '–';
const pv = (v, d = 0) => dec(v, d) + PS();
const yr = v => v == null || v === '' ? '–' : String(v);   // years print plain (2015), never grouped
const plw = (n, one, many) => Math.abs(Math.round(n)) === 1 ? one : many;
const nn = (n, pt, en) => fmt(n) + ' ' + (PT() ? plw(n, pt[0], pt[1]) : plw(n, en[0], en[1]));
const MPT = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const MSPT = ['jan.', 'fev.', 'mar.', 'abr.', 'mai.', 'jun.', 'jul.', 'ago.', 'set.', 'out.', 'nov.', 'dez.'];
const MEN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MSEN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dparts = s => s.split('-').map(Number);
const dateTxt = s => { if (!s) return '–'; const [y, m, d] = dparts(s); return PT() ? `${d} de ${MPT[m - 1]} de ${y}` : `${d} ${MEN[m - 1]} ${y}`; };
const dateShort = s => { if (!s) return '–'; const [y, m, d] = dparts(s); return PT() ? `${d} ${MSPT[m - 1]} ${y}` : `${d} ${MSEN[m - 1]} ${y}`; };
const dayMonth = s => { const [y, m, d] = dparts(s); return PT() ? `${d} ${MSPT[m - 1]}` : `${d} ${MSEN[m - 1]}`; };
const dayMonthLong = s => { const [y, m, d] = dparts(s); return PT() ? `${d} de ${MPT[m - 1]}` : `${d} ${MEN[m - 1]}`; };
const monthTxt = s => { const [y, m] = dparts(s); return PT() ? `${MPT[m - 1]} de ${y}` : `${MEN[m - 1]} ${y}`; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const BUILT = PF.built, YL = +BUILT.slice(0, 4);
const andList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + L(' e ', ' and ') + a[a.length - 1];

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;
const tq = s => `<div class="q">${esc(s)}</div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); s.append('i').attr('class', it.shape || '').style('background', it.c).style('border-color', it.c).style('color', it.c); s.append('span').text(it.l); });
  return lg;
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }
function table(el, head, rows) {
  const d = el.append('details').attr('class', 'tbl');
  d.append('summary').text(t('tbl'));
  const tb = d.append('div').attr('class', 'scroll').append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => i ? 'n' : null).text(h => h);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => i ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
  return d;
}
// path placeholders in the page's language
const PH = { '<tipo>': '<kind>', '<ano>': '<year>', '<número>': '<number>', '<legislatura>': '<legislature>', '<código>': '<code>', '<mês>': '<month>', '(até 10/11/2026)': '(until 10/11/2026)', '(autor = ato)': '(author = act)', '(descritores)': '(descriptors)', '(sumário)': '(summary)', 'sumário': 'summary' };
const phx = s => PT() ? s : Object.entries(PH).reduce((a, [k, v]) => a.split(k).join(v), s);
function note(el, src, n, extra) {
  const p = el.append('p').attr('class', 'note');
  p.html(`<b>${t('src')}:</b> ${src.map(s => `<code>${esc(phx(s))}</code>`).join(' ')} · <b>${t('n')}:</b> ${n}${extra ? ' · ' + esc(extra) : ''}`);
}
function yAxis(g, y, w, ticks = 5, f = fmt) {
  const ax = g.append('g').attr('class', 'axis grid');
  y.ticks(ticks).forEach(v => {
    ax.append('line').attr('x1', 0).attr('x2', w).attr('y1', y(v)).attr('y2', y(v));
    ax.append('text').attr('x', -6).attr('y', y(v)).attr('dy', '0.32em').attr('text-anchor', 'end').text(f(v));
  });
  return ax;
}
const W = el => Math.max(300, Math.min(1000, el.node().getBoundingClientRect().width || 900));
const Wp = el => Math.max(120, Math.min(1000, el.node().getBoundingClientRect().width || 300));   // a small-multiple panel's own width
const narrow = w => w < 560;
function colPath(x, y0, w, y1, r = 4) {

function bands(el, rows, keys, colors, names, opt) {

chart('c05', el => {
  const c = D.c05, rows = c.rows.map(([y, ...v]) => ({ y, v, n: sum(v) }));
  const old = rows.filter(r => r.y <= 2004), sat = sum(old, r => r.v[5]) / sum(old, r => r.n);
  const after = rows.filter(r => r.y >= 2006), satA = sum(after, r => r.v[5] + r.v[6]);
  return {
    title: L(`Ao sábado: até 2004, ${pct(sat, 1)} dos atos saíam ao sábado; desde 2006, ${fmt(satA)} em edições de fim de semana`, `On Saturdays: until 2004, ${pct(sat, 1)} of acts came out on a Saturday; since 2006, ${fmt(satA)} in weekend issues`),
    toc: L('O dia da semana', 'The weekday'),
    dek: L(`Cada célula é a parte dos atos de um ano publicados nesse dia da semana. Durante quase um século, o sábado foi um dia normal de publicação; o último sábado de rotina foi em 2004. Os poucos atos de fim de semana desde então concentram-se em 2020–2022, incluindo ${fmt(48)} decretos do Presidente da República num só sábado, 8 de janeiro de 2022.`,
      `Each cell is the share of a year's acts published on that weekday. For almost a century Saturday was an ordinary publication day; the last routine Saturday was in 2004. The few weekend acts since then cluster in 2020–2022, including ${fmt(48)} decrees of the President of the Republic on a single Saturday, 8 January 2022.`),
    draw(el) {
      const w = W(el), nw = narrow(w), ramp = seqRamp(), cl = v => v ? ramp(0.08 + 0.92 * Math.min(1, v / .3)) : css('--surface-2');
      legend(el, [.05, .1, .2, .3].map(v => ({ c: cl(v), l: (v === .3 ? '≥ ' : '') + pv(100 * v) })));
      const step = nw ? 2 : 1, Y = rows.filter((r, i) => i % step === 0).map(r => r.y);
      const agg = y => { const rs = rows.filter(r => r.y >= y && r.y < y + step); const v = [0, 1, 2, 3, 4, 5, 6].map(d => sum(rs, r => r.v[d])); return { y, v, n: sum(v), ys: rs.map(r => r.y) }; };
      const cells = Y.map(agg);
      const WD = L(['segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado', 'domingo'], ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']);
      const WD1 = L(['2.ª', '3.ª', '4.ª', '5.ª', '6.ª', 'sáb.', 'dom.'], ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun']);
      const lw = Math.ceil(textW(el, (nw ? WD1 : WD))) + 10, ch = nw ? 22 : 26, m = { t: 8, l: lw, r: 6 };
      const iw = w - m.l - m.r, cw = iw / cells.length, svg = svgIn(el, w, m.t + ch * 7 + 26), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      cells.forEach((cc, j) => {
        [0, 1, 2, 3, 4, 5, 6].forEach(d => g.append('rect').attr('x', j * cw + .4).attr('y', d * ch + .8).attr('width', Math.max(.5, cw - .8)).attr('height', ch - 1.6).attr('rx', Math.min(2, cw / 3)).attr('fill', cl(cc.n ? cc.v[d] / cc.n : 0)));
        const ly_ = cc.ys.find(yy => yy % (nw ? 20 : 10) === 0);
        if (ly_) g.append('text').attr('class', 'lbl').attr('x', j * cw + cw / 2).attr('y', ch * 7 + 16).attr('text-anchor', 'middle').text(ly_);
        bindTip(g.append('rect').attr('class', 'hit').attr('x', j * cw).attr('y', 0).attr('width', cw).attr('height', ch * 7).datum(cc),
          q => `<b>${q.ys.length > 1 ? q.ys[0] + '–' + q.ys[q.ys.length - 1] : q.y}</b>` + WD.map((nm, d) => trow(cl(q.n ? q.v[d] / q.n : 0), nm, `${fmt(q.v[d])} · ${pct(q.v[d], q.n)}`)).join('') + trow(null, t('total'), fmt(q.n)));
      });
      (nw ? WD1 : WD).forEach((nm, d) => g.append('text').attr('class', 'lbl strong').attr('x', -6).attr('y', d * ch + ch / 2 + 4).attr('text-anchor', 'end').text(nm));
      const j05 = cells.findIndex(cc => cc.y + step > 2004) + 1;
      if (j05 > 0) g.append('line').attr('x1', j05 * cw).attr('x2', j05 * cw).attr('y1', 5 * ch - 3).attr('y2', 6 * ch + 3).attr('stroke', css('--s2')).attr('stroke-width', 2);
      note(el, ['git log (Published:)'], fmt(sum(rows, r => r.n)) + L(' atos', ' acts'),
        L(`o dia é o da publicação no Diário do Governo ou no Diário da República, 1.ª série (com os suplementos). ${nw ? 'Neste ecrã cada coluna junta dois anos. ' : ''}A linha laranja marca o fim de 2004. Último sábado com atos antes de 2006: ${dateTxt(c.sat_last_regular)}.`,
          `the day is that of publication in the Diário do Governo or the Diário da República, 1.ª série (supplements included). ${nw ? 'On this screen each column joins two years. ' : ''}The orange line marks the end of 2004. Last Saturday with acts before 2006: ${dateTxt(c.sat_last_regular)}.`));
      table(el, [t('year'), ...WD, t('total')], rows.map(r => [yr(r.y), ...r.v, r.n]));
    }
  };
});

chart('c06', el => {
  const c = D.c06, M = c.months.filter(r => r[0] >= '2010-01' && r[0] <= '2013-12').map(([m, o, n]) => ({ m, o, n }));

      `Each column is one month of act summaries (1.ª and 2.ª séries): the share of words in the spelling from before the 1990 Orthographic Agreement (acção, actividade, direcção, efectivo, projecto, sector…) among all words that have both spellings. ${ao ? `${ao[0]} of ${dateTxt(ao[1])} applied the agreement "from 1 January 2012" to the Government and to the publication of the Diário da República. ` : ''}Below, six words, year by year.`),
    draw(el) {

      legend(el, [{ c: co, l: L('grafia antiga (acção)', 'old spelling (acção)') }, { c: cn, l: L('grafia do acordo (ação)', 'agreement spelling (ação)') }]);
      const w = W(el), nw = narrow(w), h = nw ? 200 : 230, m = { t: 26, r: 6, b: 24, l: 40 };
      const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleBand().domain(M.map(r => r.m)).range([0, iw]).padding(.15), y = d3.scaleLinear().domain([0, 1]).range([ih, 0]);
      yAxis(g, y, iw, 4, v => pv(100 * v));
      M.forEach(r => { const s = r.o / (r.o + r.n); g.append('path').attr('d', colPath(x(r.m), ih, x.bandwidth(), y(1), 2)).attr('fill', cn); if (s > 0) g.append('rect').attr('x', x(r.m)).attr('width', x.bandwidth()).attr('y', y(s)).attr('height', ih - y(s)).attr('fill', co); });
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      M.forEach(r => { if (r.m.endsWith('-01')) g.append('text').attr('class', 'lbl').attr('x', x(r.m) + x.bandwidth() / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(r.m.slice(0, 4)); });
      const xj = x('2012-01') - x.step() * x.paddingInner() / 2;
      g.append('line').attr('x1', xj).attr('x2', xj).attr('y1', -8).attr('y2', ih).attr('stroke', css('--text')).attr('stroke-dasharray', '3 3');
      halo(g, xj - 6, -12, L('1 jan. 2012', '1 Jan 2012'), 'end', 'lbl strong');
      bindTip(g.append('g').selectAll('rect').data(M).join('rect').attr('class', 'hit').attr('x', r => x(r.m)).attr('width', x.step()).attr('y', 0).attr('height', ih),
        r => `<b>${monthTxt(r.m)}</b>` + trow(co, L('Grafia antiga', 'Old spelling'), `${fmt(r.o)} · ${pct(r.o, r.o + r.n)}`) + trow(cn, L('Grafia do acordo', 'Agreement spelling'), fmt(r.n)));
      h4(el, L('Seis palavras nos sumários, por ano (antiga em cima, nova em baixo)', 'Six words in the summaries, by year (old above, new below)'), 14);
      const box = el.append('div').attr('class', 'multi');
      const panes = c.pairs.map(([a, b]) => { const p = box.append('div'); p.append('h4').text(`${a} → ${b}`); return p; });   // all panes exist before any is measured
      c.pairs.forEach(([a, b], pi) => {

        rs.forEach(r => { if (r.o) gg.append('path').attr('d', colPath(x2(r.y), y2(0), x2.bandwidth(), y2(r.o), 1.5)).attr('fill', co); if (r.n) gg.append('path').attr('d', colPathDown(x2(r.y), y2(0), x2.bandwidth(), y2(-r.n), 1.5)).attr('fill', cn); });
        gg.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw2).attr('y1', y2(0)).attr('y2', y2(0));
        [1995, 2012, YL].forEach(yy => gg.append('text').attr('class', 'lbl mut').attr('x', x2(yy) + x2.bandwidth() / 2).attr('y', ih2 + 14).attr('text-anchor', yy === 1995 ? 'start' : yy === YL ? 'end' : 'middle').text(yy));
        bindTip(gg.append('g').selectAll('rect').data(rs).join('rect').attr('class', 'hit').attr('x', r => x2(r.y)).attr('width', x2.step()).attr('y', 0).attr('height', ih2),

        L('contam-se palavras com as duas grafias numa lista fixa (acção/ação, actividade, actual, colectivo, direcção, director, efectivo, objectivo, projecto, protecção, sector, rectificação e outras, em prep.py). Os sumários são os do próprio jornal oficial.',

    }
  };
});

chart('c08', el => {

        if (yy % (nw ? 10 : 5) === 0) g.append('text').attr('class', 'lbl').attr('x', x(yy) + bw / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(yy);
      });

      // each late year's date over its column, raised above any column it would cover and above labels already placed,

      const placed = [], topOf = yy => (off(yy) > 0 ? y(off(yy)) : y(0)) - (trans.some(tr => tr.y === yy) ? 12 : 0);

    }
  };

chart('c09', el => {
  const c = D.c09, rows = c.rows.map(([y, dl, dld, l, ld, nd]) => ({ y, dl, dld, l, ld, nd, s: dl ? dld / dl : 0, sl: l ? ld / l : 0 }));

      `Since accession to the Communities in 1986, the share of each year's decree-laws and laws whose summary cites a directive. ${fmt(tot)} decree-laws and ${fmt(totl)} laws cite directives (${pct(c.transp[1], c.transp[0])} say they transpose them); the laws' share reaches ${pct(pl.ld, pl.l)} in ${pl.y}. Below, how many different directives each year's summaries cite.`),

      const y = d3.scaleLinear().domain([0, Math.max(pk.s, pl.sl)]).nice().range([ih, 0]);
      yAxis(g, y, iw, 4, v => pv(100 * v));
      const gid = 'g09' + (++HATCH), gr = svg.append('defs').append('linearGradient').attr('id', gid).attr('x1', 0).attr('x2', 0).attr('y1', 0).attr('y2', 1);
      gr.append('stop').attr('offset', 0).attr('stop-color', cd).attr('stop-opacity', .35); gr.append('stop').attr('offset', 1).attr('stop-color', cd).attr('stop-opacity', .02);
      g.append('path').datum(rows).attr('d', d3.area().x(r => x(r.y)).y0(ih).y1(r => y(r.s))).attr('fill', `url(#${gid})`);
      g.append('path').datum(rows).attr('d', d3.line().x(r => x(r.y)).y(r => y(r.s))).attr('fill', 'none').attr('stroke', cd).attr('stroke-width', 2);
      g.append('path').datum(rows.filter(r => r.l)).attr('d', d3.line().x(r => x(r.y)).y(r => y(r.sl))).attr('fill', 'none').attr('stroke', cl).attr('stroke-width', 1.6).attr('stroke-dasharray', '4 3');
      rows.forEach(r => g.append('circle').attr('cx', x(r.y)).attr('cy', y(r.s)).attr('r', 2.4).attr('fill', cd).attr('opacity', r.y === YL ? .5 : 1));
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
      x.ticks(nw ? 4 : 8).forEach(v => g.append('text').attr('class', 'lbl').attr('x', x(v)).attr('y', ih + 16).attr('text-anchor', 'middle').text(v));
      halo(g, x(pk.y), y(pk.s) - 8, `${pk.y}: ${pct(pk.dld, pk.dl)}`, 'middle', 'lbl strong', cd);
      const lastR = rows[rows.length - 1];
      halo(g, iw + 6, y(lastR.s) + 4, pct(lastR.dld, lastR.dl), 'start', 'lbl', cd);
      halo(g, x(pl.y), y(pl.sl) - 8, `${pl.y}: ${pct(pl.ld, pl.l)}`, 'middle', 'lbl strong', cl);
      bindTip(g.append('g').selectAll('rect').data(rows).join('rect').attr('class', 'hit').attr('x', r => x(r.y) - iw / rows.length / 2).attr('width', iw / rows.length).attr('y', 0).attr('height', ih),
        r => `<b>${r.y}${r.y === YL ? ' (' + t('partial') + ')' : ''}</b>` + trow(cd, L('Decretos-leis que citam uma diretiva', 'Decree-laws citing a directive'), `${fmt(r.dld)} ${L('de', 'of')} ${fmt(r.dl)} · ${pct(r.dld, r.dl)}`) +
          trow(cl, L('Leis que citam uma diretiva', 'Laws citing a directive'), `${fmt(r.ld)} ${L('de', 'of')} ${fmt(r.l)} · ${pct(r.ld, r.l)}`) + trow(null, L('Diretivas diferentes citadas', 'Different directives cited'), fmt(r.nd)));
      h4(el, L('Diretivas diferentes citadas nos sumários de cada ano', 'Different directives cited in each year\'s summaries'), 10);
      const h2 = nw ? 110 : 120, svg2 = svgIn(el, w, h2), g2 = svg2.append('g').attr('transform', `translate(${m.l},8)`), ih2 = h2 - 30;
      const xb = d3.scaleBand().domain(rows.map(r => r.y)).range([0, iw]).padding(.2), y2 = d3.scaleLinear().domain([0, d3.max(rows, r => r.nd)]).nice().range([ih2, 0]);
      yAxis(g2, y2, iw, 3);
      rows.forEach(r => { if (r.nd) g2.append('path').attr('d', colPath(xb(r.y), ih2, xb.bandwidth(), y2(r.nd), 2)).attr('fill', cols[2]).attr('opacity', r.y === YL ? .5 : 1); });
      g2.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih2).attr('y2', ih2);
      rows.forEach(r => { if (r.y % (nw ? 10 : 5) === 0) g2.append('text').attr('class', 'lbl').attr('x', xb(r.y) + xb.bandwidth() / 2).attr('y', ih2 + 15).attr('text-anchor', 'middle').text(r.y); });
      bindTip(g2.append('g').selectAll('rect').data(rows).join('rect').attr('class', 'hit').attr('x', r => xb(r.y)).attr('width', xb.step()).attr('y', 0).attr('height', ih2), r => `<b>${r.y}</b>` + trow(cols[2], L('Diretivas diferentes', 'Different directives'), fmt(r.nd)));
      note(el, ['decreto-lei/', 'lei/', 'git log (sumário)'], fmt(sum(rows, r => r.dl + r.l)) + L(' decretos-leis e leis desde 1986', ' decree-laws and laws since 1986'),
        L('um ato cita uma diretiva quando o seu sumário contém "Diretiva" ou "Directiva"; as diretivas são identificadas pelo número (2006/123/CE, (UE) 2019/1937). Os sumários longos podem omitir diretivas que o texto transpõe.',
          'an act cites a directive when its summary contains "Diretiva" or "Directiva"; directives are identified by their number (2006/123/CE, (UE) 2019/1937). Long summaries may leave out directives the text transposes.'));
      table(el, [t('year'), L('Decretos-leis', 'Decree-laws'), L('Com diretiva', 'Citing a directive'), L('Leis', 'Laws'), L('Com diretiva', 'Citing a directive'), L('Diretivas', 'Directives')], rows.map(r => [yr(r.y), r.dl, r.dld, r.l, r.ld, r.nd]));

part('p3', 'III. A Assembleia da República', 'III. The Assembleia da República',

chart('c11', el => {
  const c = D.c11, PART = ['III', 'XIII', 'XIV'], full = c.filter(r => !PART.includes(r.leg) && r.leg !== 'XVII');
  const T = k => [sum(full, r => r[k][0]), sum(full, r => r[k][1])], g0 = T('gov'), m0 = T('mps');
  return {
    title: L(`Propostas do Governo e projetos dos deputados: ${pct(g0[1], g0[0])} das propostas tornaram-se lei, ${pct(m0[1], m0[0])} dos projetos`, `Government bills and MPs' bills: ${pct(g0[1], g0[0])} of the Government's bills became law, ${pct(m0[1], m0[0])} of MPs' bills`),
    toc: L('Propostas e projetos de lei', 'Government and MPs\' bills'),
    dek: L(`Por legislatura: quantas propostas de lei apresentou o Governo e quantos projetos de lei os deputados (coluna clara) e quantos chegaram a lei publicada no Diário da República (coluna cheia), com a percentagem em cima. Nas legislaturas completas, ${fmt(g0[1])} de ${fmt(g0[0])} propostas e ${fmt(m0[1])} de ${fmt(m0[0])} projetos.`,
      `By legislature: how many bills the Government filed (propostas de lei) and how many MPs filed (projetos de lei) (light column), and how many became a law published in the Diário da República (solid column), with the percentage on top. In the complete legislatures, ${fmt(g0[1])} of ${fmt(g0[0])} Government bills and ${fmt(m0[1])} of ${fmt(m0[0])} MPs' bills.`),
    draw(el) {
      const ink = css('--s1');
      legend(el, [{ c: ink + '38', l: L('Apresentados', 'Filed') }, { c: ink, l: L('Tornaram-se lei', 'Became law') }]);
      const ymax = d3.max(c, r => Math.max(r.gov[0], r.mps[0]));
      [['gov', L('Propostas de lei (Governo)', 'Government bills (propostas de lei)')], ['mps', L('Projetos de lei (deputados)', 'MPs\' bills (projetos de lei)')]].forEach(([k, nm], pi) => {
        const tt = T(k); h4(el, `${nm} · ${L(`${fmt(tt[1])} de ${fmt(tt[0])} nas legislaturas completas (${pct(tt[1], tt[0])})`, `${fmt(tt[1])} of ${fmt(tt[0])} in the complete legislatures (${pct(tt[1], tt[0])})`)}`, pi ? 14 : 4);
        const w = W(el), nw = narrow(w), h = nw ? 180 : 210, m = { t: 18, r: 4, b: 34, l: 38 };
        const svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
        const iw = w - m.l - m.r, ih = h - m.t - m.b;
        const x = d3.scaleBand().domain(c.map(r => r.leg)).range([0, iw]).padding(.2), y = d3.scaleLinear().domain([0, k === 'gov' ? d3.max(c, r => r.gov[0]) : ymax]).nice().range([ih, 0]);
        yAxis(g, y, iw, 3);
        c.forEach(r => {
          const [n, law] = r[k], x0 = x(r.leg), bw = x.bandwidth(), op = PART.includes(r.leg) || r.leg === 'XVII' ? .5 : 1;
          g.append('path').attr('d', colPath(x0, ih, bw, y(n))).attr('fill', ink).attr('fill-opacity', .22 * op);
          g.append('path').attr('d', colPath(x0, ih, bw, y(law))).attr('fill', ink).attr('fill-opacity', op);

          if (!nw || c.indexOf(r) % 2 === 0) g.append('text').attr('class', 'lbl strong').attr('x', x0 + bw / 2).attr('y', ih + 14).attr('text-anchor', 'middle').text(r.leg);

          bindTip(g.append('rect').attr('class', 'hit').attr('x', x0 - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', 0).attr('height', ih).datum(r),
            d => `<b>${d.leg} ${L('legislatura', 'legislature')} · ${legYears(d)}</b>` + trow(null, L('Apresentados', 'Filed'), fmt(d[k][0])) + trow(ink, L('Tornaram-se lei', 'Became law'), `${fmt(d[k][1])} · ${pct(d[k][1], d[k][0])}`) +
              (PART.includes(d.leg) ? tq(L(`Os dados abertos têm ${fmt(d[k][0])} dos ${fmt(d[k][2])} números desta legislatura.`, `The open data hold ${fmt(d[k][0])} of the ${fmt(d[k][2])} numbers of this legislature.`)) : '') +
              (d.leg === 'XVII' ? tq(L('Legislatura em curso.', 'Legislature under way.')) : ''));

      });
      note(el, ['parlamento/iniciativas/<legislatura>/proposta-de-lei/', 'parlamento/iniciativas/<legislatura>/projeto-de-lei/', '…/fases/'], fmt(sum(c, r => r.gov[0] + r.mps[0])) + L(' propostas e projetos de lei', ' bills'),
        L(`uma iniciativa tornou-se lei quando tem a fase "Lei (Publicação DR)"; vários projetos sobre o mesmo tema podem dar uma só lei. As legislaturas III, XIII e XIV estão incompletas nos dados abertos (mais claras: o número de iniciativas fica abaixo do maior número atribuído) e a XVII está em curso. Por baixo de cada legislatura, o ano em que começou.`,
          `an initiative became law when it has the step "Lei (Publicação DR)"; several bills on one subject can give a single law. Legislatures III, XIII and XIV are incomplete in the open data (lighter: the number of initiatives is below the highest number assigned) and XVII is under way. Under each legislature, the year it began.`));
      table(el, [L('Legislatura', 'Legislature'), L('Anos', 'Years'), L('Propostas', 'Gov. bills'), L('Lei', 'Law'), L('Projetos', 'MPs\' bills'), L('Lei', 'Law')], c.map(r => [r.leg, legYears(r), r.gov[0], r.gov[1], r.mps[0], r.mps[1]]));
    }
  };

    draw(el) {
      const ink = css('--s1'), w = W(el), nw = narrow(w);

        g.append('path').attr('d', barPath(0, y0, x(r[1]), bh, 3)).attr('fill', ink).attr('fill-opacity', .22);
        g.append('path').attr('d', barPath(0, y0, x(r[2]), bh, 3)).attr('fill', ink);
        g.append('text').attr('class', 'lbl').attr('x', iw + 8).attr('y', y0 + bh / 2 + 4).text(rgt(r));
        bindTip(g.append('rect').attr('class', 'hit').attr('x', -m.l).attr('width', w).attr('y', i * rowH).attr('height', rowH).datum(r),
          d => `<b>${esc(partyName(d[0]))}</b>` + trow(null, L('Projetos de lei', 'Bills'), fmt(d[1])) + trow(ink, L('Tornaram-se lei', 'Became law'), `${fmt(d[2])} · ${pct(d[2], d[1])}`) + trow(null, L('Legislaturas', 'Legislatures'), `${d[3][0]}–${d[3][d[3].length - 1]}`));

chart('c13', el => {
  const c = D.c13, rows = c.rows, keys = ['ok', 'no', 'wd', 'pend'];
  const first = rows[0], last = rows[rows.length - 1], prev = rows[rows.length - 2];
  const P = c.party.map(([p, n, ok, pend]) => ({ p, n, ok, pend, rate: (n - pend) ? ok / (n - pend) : 0 })).sort((a, b) => b.rate - a.rate);
  const ps = P.find(q => q.p === 'PS'), ch = P.find(q => q.p === 'CH');
  return {
    title: L(`Propostas de alteração ao Orçamento: de ${fmt(sum(keys, k => first[k] || 0))} (OE ${first.y}) a ${fmt(sum(keys, k => last[k] || 0))} (OE ${last.y}); aprovadas ${pct(ps.ok, ps.n - ps.pend)} das do PS e ${pct(ch.ok, ch.n - ch.pend)} das do Chega`, `Amendments to the State Budget: from ${fmt(sum(keys, k => first[k] || 0))} (OE ${first.y}) to ${fmt(sum(keys, k => last[k] || 0))} (OE ${last.y}); ${pct(ps.ok, ps.n - ps.pend)} of the PS's passed and ${pct(ch.ok, ch.n - ch.pend)} of Chega's`),
    toc: L('Alterações ao Orçamento', 'Budget amendments'),
    dek: L(`Cada coluna é um Orçamento do Estado (OE) e as propostas de alteração que os deputados apresentaram, pelo resultado. O OE ${last.y} está a ser votado (quase tudo por decidir). Por baixo, por partido, a parte das propostas já decididas que foi aprovada.`,

        topLabel: r => nw ? '' : fmt(sum(keys, k => r[k] || 0)) });

part('p4', 'IV. A Constituição e os códigos', 'IV. The Constitution and the codes',

chart('c15', el => {
  const c = D.c15, R = c.revs, PK = ['pre', 'pf', 'p1', 'p2', 'p3', 'p4', 'dft'];
  const PN = { pre: ['Preâmbulo', 'Preamble'], pf: ['Princípios fundamentais', 'Fundamental principles'], p1: ['Parte I · Direitos e deveres fundamentais', 'Part I · Fundamental rights and duties'],
    p2: ['Parte II · Organização económica', 'Part II · Economic organisation'], p3: ['Parte III · Organização do poder político', 'Part III · Organisation of political power'],
    p4: ['Parte IV · Garantia e revisão', 'Part IV · Guarantee and revision'], dft: ['Disposições finais e transitórias', 'Final and transitional provisions'] };
  const words = r => sum(PK, k => r.size[k] || 0), chg = r => sum(Object.values(r.add)) + sum(Object.values(r.rem));
  const big = R.slice(1).reduce((a, b) => chg(b) > chg(a) ? b : a), yrOf = r => r.day.slice(0, 4);
  return {
    title: L(`A Constituição: de ${fmt(words(R[0]))} palavras em 1976 a ${fmt(words(R[R.length - 1]))} desde 2005; a revisão de ${yrOf(big)} mudou ${fmt(chg(big))}`, `The Constitution: from ${fmt(words(R[0]))} words in 1976 to ${fmt(words(R[R.length - 1]))} since 2005; the ${yrOf(big)} revision changed ${fmt(chg(big))}`),
    toc: L('As sete revisões da Constituição', 'The seven revisions of the Constitution'),
    dek: L(`Cada coluna é o texto dos artigos da Constituição depois de uma revisão, em palavras, por parte. Em baixo, as palavras que cada revisão acrescentou ou suprimiu: as de ${andList(R.slice(1).filter(r => chg(r) > 4000).map(yrOf))} reescreveram milhares; as de ${andList(R.slice(1).filter(r => chg(r) < 500).map(yrOf))} tocaram em poucos artigos.`,
      `Each column is the text of the Constitution's articles after a revision, in words, by part. Below, the words each revision added or removed: those of ${andList(R.slice(1).filter(r => chg(r) > 4000).map(yrOf))} rewrote thousands; those of ${andList(R.slice(1).filter(r => chg(r) < 500).map(yrOf))} touched few articles.`),
    draw(el) {
      const cols = S8(), colors = [css('--muted-mark'), cols[4], cols[0], cols[3], cols[6], cols[2], cols[1]];
      legend(el, PK.map((k, i) => ({ c: colors[i], l: L(...PN[k]) })));
      const rows = R.map(r => ({ y: yrOf(r), ...Object.fromEntries(PK.map(k => [k, r.size[k] || 0])), r }));
      const w = W(el), nw = narrow(w);
      stackedColumns(el, rows, PK, colors, PK.map(k => L(...PN[k])), { h: nw ? 240 : 280, pad: .35, bw: nw ? 28 : 56, every: 1, topLabel: r => nw ? '' : fmt(words(r.r)), ml: 48 });
      h4(el, L('Palavras acrescentadas (para cima) e suprimidas (para baixo) em cada revisão', 'Words added (up) and removed (down) by each revision'), 12);
      const rv = R.slice(1), h = nw ? 180 : 200, m = { t: 24, r: 8, b: 22, l: 48 }, svg = svgIn(el, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleBand().domain(rv.map(yrOf)).range([0, iw]).padding(.35);
      const mx = d3.max(rv, r => Math.max(sum(Object.values(r.add)), sum(Object.values(r.rem)))), y = d3.scaleLinear().domain([-mx, mx]).nice().range([ih, 0]);
      const ax = g.append('g').attr('class', 'axis grid'); y.ticks(4).forEach(v => { ax.append('line').attr('x1', 0).attr('x2', iw).attr('y1', y(v)).attr('y2', y(v)); ax.append('text').attr('x', -6).attr('y', y(v)).attr('dy', '.32em').attr('text-anchor', 'end').text(fmt(Math.abs(v))); });
      const bw = Math.min(nw ? 28 : 56, x.bandwidth());
      rv.forEach(r => {
        const x0 = x(yrOf(r)) + (x.bandwidth() - bw) / 2, a = sum(Object.values(r.add)), d = sum(Object.values(r.rem));
        g.append('path').attr('d', colPath(x0, y(0), bw, y(a), 3)).attr('fill', cols[2]);
        g.append('path').attr('d', colPathDown(x0, y(0), bw, y(-d), 3)).attr('fill', cols[7]);
        g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', y(a) - 4).attr('text-anchor', 'middle').text('+' + fmt(a));
        g.append('text').attr('class', 'lbl').attr('x', x0 + bw / 2).attr('y', y(-d) + 12).attr('text-anchor', 'middle').text('−' + fmt(d));
        bindTip(g.append('rect').attr('class', 'hit').attr('x', x0 - 6).attr('width', bw + 12).attr('y', 0).attr('height', ih).datum(r),
          q => `<b>${q.act}</b>` + trow(null, L('Em vigor', 'In force'), dateTxt(q.day)) + trow(cols[2], L('Palavras acrescentadas', 'Words added'), fmt(sum(Object.values(q.add)))) + trow(cols[7], L('Palavras suprimidas', 'Words removed'), fmt(sum(Object.values(q.rem)))) +
            trow(null, L('Ficheiros alterados', 'Files changed'), fmt(q.files.M + q.files.A + q.files.D)) + PK.map(k => (q.add[k] || q.rem[k]) ? trow(null, L(...PN[k]), `+${fmt(q.add[k] || 0)} / −${fmt(q.rem[k] || 0)}`) : '').join(''));
      });
      g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', y(0)).attr('y2', y(0));
      rv.forEach(r => g.append('text').attr('class', 'lbl strong').attr('x', x(yrOf(r)) + x.bandwidth() / 2).attr('y', ih + 16).attr('text-anchor', 'middle').text(yrOf(r)));
      note(el, ['constitution/constituicao/', 'constituicao/ (até 10/11/2026)', 'git log --raw'], fmt(R.length) + L(' versões', ' versions'),
        L('palavras dos artigos e do preâmbulo, sem os números dos artigos nem os títulos das divisões; as diferenças são calculadas sobre o texto inteiro, por parágrafo e por palavra, para que um artigo que só mudou de número não conte. O texto de 1976 é o que o Diário da República consolida (termina no artigo 295.º). A revisão de 1982 inclui uma alteração do mesmo dia que o DR não atribui e uma disposição em vigor a 1 de outubro de 1983.',
          'words of the articles and the preamble, without article numbers or division headings; differences are computed on the whole text, by paragraph and by word, so that an article that only changed number does not count. The 1976 text is the one the Diário da República consolidates (it ends at article 295). The 1982 revision includes a same-day change the DR does not attribute and a provision in force from 1 October 1983.'));
      table(el, [L('Versão', 'Version'), L('Em vigor', 'In force'), ...PK.map(k => L(...PN[k])), t('total'), L('Acrescentadas', 'Added'), L('Suprimidas', 'Removed')],
        R.map((r, i) => [r.act, dateShort(r.day), ...PK.map(k => r.size[k] || 0), words(r), i ? sum(Object.values(r.add)) : '–', i ? sum(Object.values(r.rem)) : '–']));
    }
  };
});

chart('c16', el => {
  const c = D.c16, codes = Object.keys(c.codes).filter(k => k !== 'constituicao' && CODEN[k]).sort((a, b) => c.acts[b] - c.acts[a]);
  const cc = codes[0], cp = codes[1];
  return {
    title: L(`Os códigos: o ${codeName(cc)} foi alterado por ${fmt(c.acts[cc])} atos desde 1967; o ${codeName(cp)}, por ${fmt(c.acts[cp])} desde ${c.first[cp].slice(0, 4)}`, `The codes: the ${codeName(cc)} was amended by ${fmt(c.acts[cc])} acts since 1967; the ${codeName(cp)} by ${fmt(c.acts[cp])} since ${c.first[cp].slice(0, 4)}`),
    toc: L('Os códigos', 'The codes'),
    dek: L(`Cada linha é um código e cada célula um ano: quantos atos o alteraram, segundo a cronologia de alterações do Diário da República. À direita, o total. Cada código começa no primeiro dia do seu texto consolidado.`,
      `Each row is a code and each cell a year: how many acts amended it, according to the Diário da República's amendment timeline. On the right, the total. Each code starts on the first day of its consolidated text.`),
    draw(el) {
      const w = W(el), nw = narrow(w), ramp = seqRamp(), step = nw ? 5 : 1, Y0 = 1967;
      const bins = d3.range(Y0 - (Y0 % step), YL + 1, step);
      const val = (k, b) => sum(d3.range(b, b + step), yy => c.codes[k][yy] || 0);
      const mx = d3.max(codes, k => d3.max(bins, b => val(k, b)));
      const cl = v => v ? ramp(0.18 + 0.82 * Math.sqrt(v / mx)) : null;
      legend(el, [1, Math.round(mx / 3), mx].map(v => ({ c: cl(v), l: L(`${fmt(v)} ${plw(v, 'ato', 'atos')}${step > 1 ? ' em 5 anos' : ' num ano'}`, `${fmt(v)} ${plw(v, 'act', 'acts')}${step > 1 ? ' in 5 years' : ' in a year'}`) })));
      const lab = k => codeName(k), up = nw, rh = up ? 30 : 20;
      const lw = up ? 0 : Math.ceil(textW(el, codes.map(lab))) + 12, rw = 36, m = { t: 4, l: lw, r: rw, b: 22 };
      const svg = svgIn(el, w, m.t + m.b + rh * codes.length), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
      const iw = w - m.l - m.r, x = d3.scaleBand().domain(bins).range([0, iw]).padding(0), cw = x.bandwidth();
      codes.forEach((k, i) => {
        const y0 = i * rh + (up ? 13 : 0), ch = rh - (up ? 15 : 3), f0 = +c.first[k].slice(0, 4);
        if (up) g.append('text').attr('class', 'lbl strong').attr('x', 0).attr('y', y0 - 2).text(lab(k));
        else g.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', y0 + ch / 2 + 4).attr('text-anchor', 'end').text(lab(k));
        g.append('rect').attr('x', x(bins.find(b => b + step > f0))).attr('width', iw - x(bins.find(b => b + step > f0))).attr('y', y0).attr('height', ch).attr('rx', 2).attr('fill', css('--surface-2'));
        bins.forEach(b => { const v = val(k, b); if (v) g.append('rect').attr('x', x(b) + .5).attr('width', Math.max(1, cw - 1)).attr('y', y0).attr('height', ch).attr('rx', 1.5).attr('fill', cl(v)); });
        g.append('text').attr('class', 'lbl').attr('x', iw + 6).attr('y', y0 + ch / 2 + 4).text(fmt(c.acts[k]));
        bindTip(g.append('rect').attr('class', 'hit').attr('x', up ? 0 : -m.l).attr('width', up ? iw + rw : w).attr('y', i * rh).attr('height', rh).datum(k),
          kk => { const ys = Object.entries(c.codes[kk]).sort((a, b) => b[1] - a[1]).slice(0, 4); return `<b>${esc(codeName(kk))}</b>` + trow(null, L('Texto consolidado desde', 'Consolidated text since'), dateTxt(c.first[kk])) + trow(null, L('Atos que o alteraram', 'Acts that amended it'), fmt(c.acts[kk])) + ys.map(([yy, v]) => trow(null, yy, fmt(v))).join(''); });
      });
      bins.forEach(b => { if (b % (nw ? 10 : 10) === 0) g.append('text').attr('class', 'lbl').attr('x', x(b) + (nw ? 0 : cw / 2)).attr('y', rh * codes.length + (up ? 13 : 0) + 14).attr('text-anchor', nw ? 'start' : 'middle').text(b); });
      note(el, ['code/<código>/', 'codigo-civil/, codigo-do-trabalho/ (até 10/11/2026)', 'git log --raw (autor = ato)'], fmt(codes.length) + L(' códigos', ' codes'),
        L('um ato alterou o código quando é o autor de pelo menos uma nova versão de um artigo; não contam as declarações de retificação nem as alterações que o DR não atribui. A história do Código Civil começa na cronologia do DR em 1975 (alterações anteriores aparecem na primeira versão seguinte). Os cinco códigos fiscais publicados pela Autoridade Tributária só têm o texto atual e ficam de fora.',
          'an act amended a code when it is the author of at least one new version of an article; declarations of rectification and changes the DR does not attribute do not count. The Civil Code\'s timeline in the DR starts in 1975 (earlier changes appear in the next version). The five tax codes published by the Tax Authority have only their current text and are left out.'));
      table(el, [L('Código', 'Code'), L('Desde', 'Since'), L('Atos', 'Acts')], codes.map(k => [codeName(k), dateShort(c.first[k]), c.acts[k]]));
    }
  };
});

chart('c18', el => {

// labels are measured as they are drawn: draw again when the web fonts have loaded, so the measures are the fonts' own
let ft;
const redraw = () => { clearTimeout(ft); ft = setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 120); };
const T0 = Date.now();
if (document.fonts) { if (document.fonts.status !== 'loaded') document.fonts.ready.then(redraw); document.fonts.addEventListener('loadingdone', () => { if (Date.now() - T0 < 15000) redraw(); }); }
</script>
